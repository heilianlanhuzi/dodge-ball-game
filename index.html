<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>躲避圆球闯关</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #gameContainer {
      position: relative;
      width: 400px;
      height: 600px;
      background: linear-gradient(180deg, #16213e 0%, #1a1a2e 100%);
      border: 4px solid #0f3460;
      border-radius: 8px;
      overflow: hidden;
    }
    #gameCanvas { display: block; }
    #ui {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      color: #fff;
      font-size: 14px;
      z-index: 10;
    }
    #startScreen, #gameOverScreen, #winScreen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 20;
    }
    #startScreen h1, #gameOverScreen h1, #winScreen h1 {
      font-size: 28px;
      margin-bottom: 20px;
      color: #e94560;
      text-shadow: 0 0 10px #e94560;
    }
    #startScreen p, #gameOverScreen p, #winScreen p {
      font-size: 14px;
      margin-bottom: 30px;
      color: #aaa;
      text-align: center;
      line-height: 1.6;
    }
    .btn {
      padding: 12px 40px;
      font-size: 18px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
    }
    .btn:hover {
      background: #ff6b6b;
      transform: scale(1.05);
    }
    #gameOverScreen h1 { color: #ff4757; }
    #winScreen h1 { color: #2ed573; text-shadow: 0 0 10px #2ed573; }
    .hidden { display: none !important; }
    #mobileControls {
      position: absolute;
      bottom: 20px; left: 0;
      width: 100%;
      display: none;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 15;
    }
    .controlBtn {
      width: 60px; height: 60px;
      background: rgba(233, 69, 96, 0.3);
      border: 2px solid #e94560;
      border-radius: 50%;
      color: #fff;
      font-size: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .controlBtn:active { background: rgba(233, 69, 96, 0.6); }
    @media (max-width: 500px) {
      #gameContainer { width: 100vw; height: 100vh; border: none; border-radius: 0; }
      #mobileControls { display: flex; }
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div id="ui">
      <span id="levelDisplay">关卡：1</span>
      <span id="progressDisplay">进度：■■■■□</span>
    </div>
    <div id="startScreen">
      <h1>🔴 躲避圆球</h1>
      <p>左右移动躲避下落的圆球<br>到达右侧绿色门即可通关</p>
      <p>💻 键盘：← → 移动<br>📱 手机：点击左右按钮</p>
      <button class="btn" id="startBtn">开始游戏</button>
    </div>
    <div id="gameOverScreen" class="hidden">
      <h1>💀 游戏结束</h1>
      <p id="deathReason">被圆球击中了！</p>
      <button class="btn" id="retryBtn">再试一次</button>
    </div>
    <div id="winScreen" class="hidden">
      <h1>🎉 恭喜通关！</h1>
      <p>你成功到达了出口！</p>
      <button class="btn" id="nextLevelBtn">下一关</button>
    </div>
    <div id="mobileControls">
      <div class="controlBtn" id="leftBtn">◀</div>
      <div class="controlBtn" id="rightBtn">▶</div>
    </div>
  </div>

  <script>
    const CONFIG = {
      playerSpeed: 5,
      playerWidth: 30,
playerHeight: 50,
ballBaseSpeed: 2,
ballSpeedIncrease: 0.5,
ballSpawnRate: 60,
doorWidth: 50,
doorHeight: 70,
colors: {
player: '#ffffff',
ball: '#2ed573',
ballGlow: 'rgba(46, 213, 115, 0.5)',
door: '#7bed9f',
doorFrame: '#2ed573',
platform: '#0f3460',
progress: '#e94560'
}
};
let canvas, ctx;
let gameState = 'start';
let currentLevel = 1;
let frames = 0;
let player, balls, door, platforms;
let keys = { left: false, right: false };
let audioCtx;
window.onload = () => {
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);
  document.getElementById('nextLevelBtn').addEventListener('click', nextLevel);
  
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  });
  document.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  });
  
  const leftBtn = document.getElementById('leftBtn');
  const rightBtn = document.getElementById('rightBtn');
  leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
  leftBtn.addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
  rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
  rightBtn.addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });
  leftBtn.addEventListener('mousedown', () => keys.left = true);
  leftBtn.addEventListener('mouseup', () => keys.left = false);
  rightBtn.addEventListener('mousedown', () => keys.right = true);
  rightBtn.addEventListener('mouseup', () => keys.right = false);
  
  requestAnimationFrame(gameLoop);
};
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  
  switch(type) {
    case 'jump':
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.1);
      break;
    case 'hit':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.3);
      break;
    case 'win':
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
      osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
      osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
      osc.start(audioCtx.currentTime);
osc.stop(audioCtx.currentTime + 0.5);
break;
}
}
function initLevel(level) {
  player = { x: 50, y: canvas.height - 100, width: CONFIG.playerWidth, height: CONFIG.playerHeight, vx: 0 };
  door = { x: canvas.width - 80, y: canvas.height - 80, width: CONFIG.doorWidth, height: CONFIG.doorHeight };
  platforms = [];
  const platformCount = Math.min(level, 5);
  for (let i = 0; i < platformCount; i++) {
    platforms.push({
      x: Math.random() * (canvas.width - 100),
      y: 150 + i * 100,
      width: 80 + Math.random() * 60,
      height: 15
    });
  }
  balls = [];
  frames = 0;
}
function startGame() {
  initAudio();
  gameState = 'playing';
  currentLevel = 1;
  initLevel(currentLevel);
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('winScreen').classList.add('hidden');
  updateUI();
}
function nextLevel() {
  currentLevel++;
  gameState = 'playing';
  initLevel(currentLevel);
  document.getElementById('winScreen').classList.add('hidden');
  updateUI();
}
function gameOver(reason) {
  gameState = 'gameover';
  playSound('hit');
  document.getElementById('deathReason').textContent = reason;
  document.getElementById('gameOverScreen').classList.remove('hidden');
}
function winLevel() {
  gameState = 'win';
  playSound('win');
  document.getElementById('winScreen').classList.remove('hidden');
}
function updateUI() {
  document.getElementById('levelDisplay').textContent = `关卡：${currentLevel}`;
  const progress = Math.min(currentLevel, 5);
  const bars = '■'.repeat(progress) + '□'.repeat(5 - progress);
  document.getElementById('progressDisplay').textContent = `进度：${bars}`;
}
function update() {
  if (gameState !== 'playing') return;
  frames++;
  if (keys.left) player.x -= CONFIG.playerSpeed;
  if (keys.right) player.x += CONFIG.playerSpeed;
  player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
  
  const spawnRate = Math.max(20, CONFIG.ballSpawnRate - currentLevel * 5);
  if (frames % spawnRate === 0) {
    const ballSize = 15 + Math.random() * 20;
    balls.push({
      x: Math.random() * (canvas.width - ballSize * 2) + ballSize,
      y: -ballSize,
      radius: ballSize,
      speed: CONFIG.ballBaseSpeed + (currentLevel - 1) * CONFIG.ballSpeedIncrease + Math.random()
    });
  }
  
  for (let i = balls.length - 1; i >= 0; i--) {
    balls[i].y += balls[i].speed;
    if (balls[i].y - balls[i].radius > canvas.height) balls.splice(i, 1);
  }
  
  for (const ball of balls) {
    if (checkCircleRectCollision(ball, player)) { gameOver('被圆球击中了！'); return; }
  }
  
  if (checkRectCollision(player, door)) { winLevel(); return; }
}
function checkCircleRectCollision(circle, rect) {
  const closestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.width));
  const closestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.height));
  const dx = circle.x - closestX;
  const dy = circle.y - closestY;
  return (dx * dx + dy * dy) < (circle.radius * circle.radius);
}
function checkRectCollision(rect1, rect2) {
  return rect1.x < rect2.x + rect2.width &&
         rect1.x + rect1.width > rect2.x &&
         rect1.y < rect2.y + rect2.height &&
         rect1.y + rect1.height > rect2.y;
}
function draw() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.strokeStyle = 'rgba(15, 52, 96, 0.3)';
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.hei
}
for (let y = 0; y < canvas.height; y += 40) {
ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
}
  if (gameState === 'start') return;
  
  ctx.fillStyle = CONFIG.colors.platform;
  for (const platform of platforms) {
    ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
    ctx.strokeStyle = '#1a5276';
    ctx.strokeRect(platform.x, platform.y, platform.width, platform.height);
  }
  
  drawDoor();
  drawPlayer();
  
  for (const ball of balls) drawBall(ball);
}
function drawPlayer() {
  const x = player.x, y = player.y;
  ctx.fillStyle = CONFIG.colors.player;
  ctx.fillRect(x + 10, y + 20, 10, 25);
  ctx.beginPath();
  ctx.arc(x + 15, y + 12, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(x + 10, y + 45, 4, 8);
  ctx.fillRect(x + 16, y + 45, 4, 8);
  const armSwing = Math.sin(frames * 0.2) * 5;
  ctx.fillRect(x + 5 + armSwing, y + 22, 5, 12);
  ctx.fillRect(x + 20 - armSwing, y + 22, 5, 12);
  ctx.fillStyle = '#000';
  ctx.fillRect(x + 12, y + 10, 2, 3);
  ctx.fillRect(x + 16, y + 10, 2, 3);
}
function drawBall(ball) {
  ctx.shadowColor = CONFIG.colors.ball;
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
  ctx.fillStyle = CONFIG.colors.ball;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(ball.x - ball.radius * 0.3, ball.y - ball.radius * 0.3, ball.radius * 0.3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.fill();
  ctx.shadowBlur = 0;
}
function drawDoor() {
  const x = door.x, y = door.y;
  ctx.fillStyle = CONFIG.colors.doorFrame;
  ctx.fillRect(x, y, 5, door.height);
  ctx.fillRect(x + door.width - 5, y, 5, door.height);
  ctx.fillRect(x, y, door.width, 5);
  ctx.fillStyle = 'rgba(123, 237, 159, 0.3)';
  ctx.fillRect(x + 5, y + 5, door.width - 10, door.height - 5);
  ctx.beginPath();
  ctx.arc(x + door.width - 12, y + door.height / 2, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#ffd700';
  ctx.fill();
}
function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
